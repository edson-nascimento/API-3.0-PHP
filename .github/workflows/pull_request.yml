name: Run lint and tests
on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Rodar testes E2E/integração (composer test:e2e)'
        required: false
        type: boolean
        default: false

env:
  PHP_VERSION: 8.3
  PHP_EXTENSIONS: mbstring, curl
  PHP_TOOLS: composer:v2, phpunit:11

permissions:
  id-token: write
  contents: read

jobs:
  run-tests:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: ${{ env.PHP_TOOLS }}

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate composer files
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Security audit
        run: composer audit --no-dev

      - name: Static analysis
        run: composer phpstan

      - name: Run unit tests
        run: composer test:unit

      - name: Run E2E tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_e2e }}
        env:
          CIELO_MERCHANT_ID: ${{ secrets.CIELO_MERCHANT_ID }}
          CIELO_MERCHANT_KEY: ${{ secrets.CIELO_MERCHANT_KEY }}
          CIELO_CLIENT_ID_3DS: ${{ secrets.CIELO_CLIENT_ID_3DS }}
          CIELO_CLIENT_SECRET_3DS: ${{ secrets.CIELO_CLIENT_SECRET_3DS }}
        run: composer test:e2e
